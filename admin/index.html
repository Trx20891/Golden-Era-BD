<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar (title, unsaved state, Save), left nav on desktop / scrolling tabs on phone, card based pages, right-side drawer for editing one product. */
:root{--bg:#F3F5FA;--card:#fff;--ink:#0F172A;--mute:#5B6579;--line:#E3E7EF;--brand:#1E3A8A;--brand-ink:#fff;--soft:#EAF0FF;--ok:#12805C;--warn:#FFF4D6;--warn-ink:#6B4A00;--bad:#C0301C;--shadow:0 18px 50px rgba(15,23,42,.2);--f:'DM Sans','Hind Siliguri',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-weight:600;text-decoration:none;color:var(--ink);transition:background .15s,box-shadow .15s}
.btn:hover{box-shadow:0 4px 14px rgba(15,23,42,.1)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad);border-color:#F1C5BD}
.btn.full{display:flex;width:100%}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.fld{margin:12px 0}
.fld>label,.lbl{display:block;font-weight:600;margin-bottom:5px}
.fld small,.hint{color:var(--mute);font-weight:400;font-size:13.5px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px}
.in:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,58,138,.14)}
textarea.in{resize:vertical;min-height:80px}
.in.bad{border-color:var(--bad)}
.g2,.g3{display:grid;gap:0 14px}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.chk input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.card h2{font-size:17px;margin-bottom:4px}
.card>.hint{margin:0 0 8px}
.status{border-radius:10px;padding:10px 13px;margin:12px 0;font-weight:600}
.status.ok{background:#E3F6EE;color:var(--ok)}
.status.err{background:#FDECE8;color:#8A2413}
.status.info{background:var(--soft);color:var(--brand)}
.note{background:var(--warn);color:var(--warn-ink);border-radius:10px;padding:10px 13px;margin:12px 0}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--brand);margin:2px 4px 2px 0}
.chip.w{background:var(--warn);color:var(--warn-ink)}
.chip.d{background:#111827;color:#fff}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.03em}
/* login */
.login{max-width:520px;margin:0 auto;padding-top:34px;padding-bottom:40px}
.login h1{font-size:28px}
/* shell */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in-bar{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.top b.t{font-size:18px}
.sp{flex:1}
.dirty{background:var(--warn);color:var(--warn-ink);font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.body{max-width:1180px;margin:0 auto}
.nav{display:flex;gap:4px;overflow-x:auto;padding-top:10px;padding-bottom:4px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button,.nav a{flex:none;border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--mute);text-decoration:none;text-align:left}
.nav button.on{background:var(--soft);color:var(--brand)}
@media(min-width:900px){.body{display:grid;grid-template-columns:220px 1fr;gap:26px}.nav{flex-direction:column;position:sticky;top:76px;align-self:start;padding-top:18px}.nav hr{width:100%;border:0;border-top:1px solid var(--line);margin:8px 0}}
main{padding-bottom:70px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:28px;display:block;line-height:1.1}
.stat span{color:var(--mute);font-size:13.5px}
.todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.todo.done i{background:var(--ok);border-color:var(--ok)}
.todo span{flex:1}
.todo.done span{color:var(--mute);text-decoration:line-through}
/* products */
.pbar{display:grid;gap:10px;margin:14px 0}
@media(min-width:700px){.pbar{grid-template-columns:1fr 200px auto}}
.pi{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;align-items:center}
@media(min-width:700px){.pi{grid-template-columns:56px minmax(0,1fr) auto}}
.pi img{width:56px;height:70px;object-fit:cover;object-position:center 15%;border-radius:8px;display:block;background:var(--soft)}
.pi .pm{min-width:0}
.pi .pm b{display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.pi .pm small{color:var(--mute)}
.pi .acts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
@media(min-width:700px){.pi .acts{grid-column:auto;justify-content:flex-end}}
.pi.hid{opacity:.6}
/* categories / events */
.cat{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:#fff}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap}
.subs{margin:10px 0 0 10px;padding-left:12px;border-left:3px solid var(--soft)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .in{flex:1}
.er{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.er input[type=color],.vh input[type=color],.fld input[type=color]{width:44px;height:42px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
/* drawer */
.dov{position:fixed;inset:0;z-index:60;background:rgba(10,16,32,.5);display:flex;justify-content:flex-end;animation:fade .2s both}
.drawer{background:#fff;width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .28s cubic-bezier(.2,.8,.2,1) both}
.still,.still .drawer{animation:none}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{translate:40px 0;opacity:.3}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dh b{font-size:17px}
.dh .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1}
.db{flex:1;overflow:auto;padding:6px 16px 24px;overscroll-behavior:contain}
.df{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:6px}
.sec:first-child{border-top:0;margin-top:6px}
.sec h3{font-size:15px;margin:10px 0 2px}
.evchk{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.var{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#FAFBFE}
.vh{display:grid;grid-template-columns:minmax(0,1fr) 44px auto;gap:8px;align-items:center}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.im{position:relative;width:78px;height:98px}
.im img{width:100%;height:100%;object-fit:cover;object-position:center 15%;border-radius:9px;display:block;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
.im button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:16px;line-height:1;padding:0}
.add{width:78px;height:98px;border:2px dashed var(--line);border-radius:9px;background:#fff;color:var(--mute);font-weight:600;font-size:13px}
.add:hover{border-color:var(--brand);color:var(--brand)}
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgf img{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-weight:600;max-width:90vw;text-align:center}
ol.help li{margin:9px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer"></div>
<div id="toast" hidden></div>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const BN='০১২৩৪৫৬৭৮৯';
const toEn=s=>String(s).replace(/[০-৯]/g,d=>BN.indexOf(d));
const num=v=>parseInt(toEn(v).replace(/[^\d]/g,''),10)||0;
const fmt=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100"><rect width="80" height="100" fill="#e9ecf3"/><text x="40" y="54" font-size="11" text-anchor="middle" fill="#7a859c" font-family="sans-serif">No photo</text></svg>');
const DEF={name:'Golden Era BD',tagline:'',logo:'',waIcon:'',ogImage:'',favicon:'',brandColor:'#1E3A8A',heroEyebrow:'',heroTitle:'',heroSub:'',heroBtn:'',perks:[],marquee:[],about:'',policies:[],copyright:'© {year} Rafid Ahammed. সর্বস্বত্ব সংরক্ষিত।',orderEmail:'',emailjsService:'',emailjsTemplate:'',emailjsKey:'',contactEmail:'',phone:'',whatsapp:'',facebook:'',address:'',bkash:'',nagad:'',feeIn:60,feeOut:120,freeOver:0};
const PAGES=[['dash','Dashboard'],['products','Products'],['cats','Categories'],['events','Event collections'],['site','Website & footer'],['contact','Contact & orders'],['help','Help']];

let CFG=null,S=null,SHA=null;
const pending={},previews={};
const ui={view:'login',page:'dash',busy:false,status:null,dirty:false,edit:null,q:'',fcat:'',confirm:'',drawerKey:''};

/* ---------- storage / api ---------- */
const loadCfg=()=>{try{const a=localStorage.getItem('adm2')||sessionStorage.getItem('adm2');return a?JSON.parse(a):null}catch(e){return null}};
const saveCfg=()=>{try{localStorage.removeItem('adm2');sessionStorage.removeItem('adm2');(CFG.remember?localStorage:sessionStorage).setItem('adm2',JSON.stringify(CFG))}catch(e){}};
const clearCfg=()=>{try{localStorage.removeItem('adm2');sessionStorage.removeItem('adm2')}catch(e){}};
const fromB64=s=>{const b=atob(s.replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)};
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(CFG.owner)+'/'+encodeURIComponent(CFG.repo)+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||r.statusText);e.status=r.status;throw e}
  return j;
}
function errMsg(e){
  if(e.status===401)return 'The token is wrong or expired. Create a new token and log in again.';
  if(e.status===403)return 'This token cannot write to the repository. Open the token settings and set Contents to "Read and write".';
  if(e.status===404)return 'Repository, branch or data/shop.json was not found. Check the repository name and branch, and that you uploaded the data folder.';
  if(e.status===409||e.status===422)return 'The repository changed while you were editing. Reload this page and try again. ('+e.message+')';
  if(!e.status)return 'Could not reach GitHub. Check your internet connection.';
  return e.message||'Something went wrong.';
}
function norm(d){
  d=d||{};
  const sh=Object.assign({},DEF,d.shop||{});
  ['perks','marquee','policies'].forEach(k=>{if(!Array.isArray(sh[k]))sh[k]=[]});
  S={shop:sh,categories:d.categories||[],events:d.events||[],products:d.products||[]};
  S.categories.forEach(c=>{c.subs=c.subs||[];if(c.visible===undefined)c.visible=true});
  S.products.forEach(p=>{
    p.events=p.events||[];p.sizes=p.sizes||[];if(p.visible===undefined)p.visible=true;
    p.variants=(p.variants||[]).map(v=>{if(!v.imgs)v.imgs=v.img?[v.img]:[];delete v.img;return v});
    if(!p.variants.length)p.variants=[{id:'v'+uid(),name:'Default',hex:'#888888',imgs:[]}];
  });
}
async function loadShop(){
  const j=await gh('/contents/data/shop.json?ref='+encodeURIComponent(CFG.branch));
  norm(JSON.parse(fromB64(j.content)));SHA=j.sha;ui.dirty=false;
}
function setStatus(t,m){ui.status=t?{t,m}:null;const el=$('#status');if(el){el.className='status '+(t||'');el.textContent=m||'';el.hidden=!t}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},2400)}
function markDirty(){ui.dirty=true;ui.confirm='';const d=$('#dirty'),dc=$('#discard');if(d)d.hidden=false;if(dc)dc.hidden=false}

/* ---------- helpers ---------- */
const prod=id=>S.products.find(p=>p.id===id);
const catOf=id=>S.categories.find(c=>c.id===id);
const imgSrc=p=>!p?PH:(previews[p]||(/^(https?:|data:)/.test(p)?p:'../'+p));
const pImg=p=>{for(const v of p.variants)if(v.imgs[0])return imgSrc(v.imgs[0]);return PH};
const isPh=p=>!p||p.indexOf('placeholder-')>=0;
function nextCode(){
  let pre='RB-',max=100;
  const m0=S.products.map(p=>/^(.*?)(\d+)$/.exec(p.code||'')).filter(Boolean);
  if(m0.length)pre=m0[0][1];
  m0.forEach(m=>{if(m[1]===pre)max=Math.max(max,+m[2])});
  return pre+(max+1);
}
function pathsUsed(){
  const u=new Set();
  S.products.forEach(p=>{p.variants.forEach(v=>v.imgs.forEach(x=>u.add(x)));if(p.video)u.add(p.video)});
  ['logo','waIcon','ogImage','favicon'].forEach(k=>{if(S.shop[k])u.add(S.shop[k])});
  return u;
}
function problems(){
  const out=[],codes={};
  S.products.forEach(p=>{
    const nm=p.name||'(no name)';
    if(!p.name.trim())out.push('A product has no name.');
    if(!p.code.trim())out.push('"'+nm+'" has no product code.');
    else if(codes[p.code.trim().toLowerCase()])out.push('Product code "'+p.code+'" is used twice.');
    codes[(p.code||'').trim().toLowerCase()]=1;
    if(!p.cat)out.push('"'+nm+'" has no category.');
    if(!(p.price>0))out.push('"'+nm+'" has no price.');
    p.variants.forEach(v=>{
      if(!v.imgs.length||v.imgs.some(isPh))out.push('"'+nm+'" needs a photo for '+(v.name?'"'+v.name+'"':'each color')+'.');
      if(p.variants.length>1&&!v.name.trim())out.push('"'+nm+'" has a color without a name.');
    });
  });
  return out;
}
function cleanData(){
  const used=pathsUsed();
  return JSON.parse(JSON.stringify({schema:2,shop:S.shop,categories:S.categories,events:S.events,products:S.products}),(k,v)=>v);
}

/* ---------- save: one commit with every changed file ---------- */
function seoHtml(){
  const sh=S.shop,base=new URL('../',location.href).href,abs=p=>p?(/^https?:/.test(p)?p:base+p):'';
  const e=x=>String(x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const n=sh.name||'Shop',d=sh.tagline||'',og=abs(sh.ogImage||sh.logo);
  return {fav:sh.favicon||sh.logo||'data:,',block:'<!--SEO-START-->\n<title>'+e(n)+'</title>\n<meta name="description" content="'+e(d)+'">\n<meta property="og:type" content="website">\n<meta property="og:site_name" content="'+e(n)+'">\n<meta property="og:title" content="'+e(n)+'">\n<meta property="og:description" content="'+e(d)+'">\n<meta property="og:url" content="'+e(base)+'">\n'+(og?'<meta property="og:image" content="'+e(og)+'">\n<meta name="twitter:image" content="'+e(og)+'">\n':'')+'<meta name="twitter:card" content="'+(og?'summary_large_image':'summary')+'">\n<!--SEO-END-->'};
}
async function seoFile(head){
  const r=await gh('/contents/index.html?ref='+head);
  const html=decodeURIComponent(escape(atob(r.content.replace(/\s/g,''))));
  const x=seoHtml();
  const out=html.replace(/<!--SEO-START-->[\s\S]*?<!--SEO-END-->/,()=>x.block).replace(/<link rel="icon" id="fav" href="[^"]*">/,()=>'<link rel="icon" id="fav" href="'+x.fav.replace(/"/g,'&quot;')+'">');
  return out===html?null:out;
}
async function save(){
  if(ui.busy)return;
  const pr=problems();
  if(pr.length){setStatus('err','Fix this first: '+pr.slice(0,3).join(' ')+(pr.length>3?' (+'+(pr.length-3)+' more)':''));window.scrollTo({top:0,behavior:'smooth'});return}
  ui.busy=true;paintBar();setStatus('info','Saving…');
  try{
    const used=pathsUsed(),files=Object.keys(pending).filter(p=>used.has(p));
    const br=enc(CFG.branch);
    const ref=await gh('/git/ref/heads/'+br),head=ref.object.sha;
    const cur=await gh('/contents/data/shop.json?ref='+head);
    if(SHA&&cur.sha!==SHA)throw Object.assign(new Error('data/shop.json was changed somewhere else. Reload this page, then make your changes again.'),{status:409});
    const commit=await gh('/git/commits/'+head);
    const tree=[];let n=0;
    for(const p of files){
      setStatus('info','Uploading file '+(++n)+' of '+files.length+'…');
      const b=await gh('/git/blobs',{method:'POST',body:{content:pending[p].b64,encoding:'base64'}});
      tree.push({path:p,mode:'100644',type:'blob',sha:b.sha});
    }
    setStatus('info','Updating link preview…');
    try{const nh=await seoFile(head);if(nh){const ib=await gh('/git/blobs',{method:'POST',body:{content:nh,encoding:'utf-8'}});tree.push({path:'index.html',mode:'100644',type:'blob',sha:ib.sha})}}catch(_){}
    setStatus('info','Saving shop data…');
    const sb=await gh('/git/blobs',{method:'POST',body:{content:JSON.stringify(cleanData(),null,2)+'\n',encoding:'utf-8'}});
    tree.push({path:'data/shop.json',mode:'100644',type:'blob',sha:sb.sha});
    const t=await gh('/git/trees',{method:'POST',body:{base_tree:commit.tree.sha,tree}});
    const c=await gh('/git/commits',{method:'POST',body:{message:'Update shop from admin panel'+(files.length?' (+'+files.length+' files)':''),tree:t.sha,parents:[head]}});
    await gh('/git/refs/heads/'+br,{method:'PATCH',body:{sha:c.sha}});
    SHA=sb.sha;files.forEach(p=>delete pending[p]);
    ui.dirty=false;ui.busy=false;render();
    setStatus('ok','Saved. Your website will show the changes in 1–2 minutes.');
  }catch(e){ui.busy=false;paintBar();setStatus('err',errMsg(e))}
}
function paintBar(){
  const b=$('#savebtn');if(b){b.disabled=ui.busy;b.textContent=ui.busy?'Saving…':'Save changes'}
}
async function discard(){
  if(ui.confirm!=='discard'){ui.confirm='discard';const d=$('#discard');if(d)d.textContent='Click again to discard';return}
  ui.confirm='';ui.busy=true;paintBar();
  try{await loadShop();Object.keys(pending).forEach(k=>delete pending[k]);ui.edit=null;ui.busy=false;render();renderDrawer();setStatus('ok','Changes discarded.')}
  catch(e){ui.busy=false;setStatus('err',errMsg(e))}
}

/* ---------- login ---------- */
function renderLogin(){
  const host=location.hostname,path=location.pathname.split('/').filter(Boolean);
  const o=/\.github\.io$/.test(host)?host.split('.')[0]:'',r=(o&&path.length>1)?path[0]:'';
  $('#app').innerHTML=`<div class="pad"><div class="login"><h1>Shop admin</h1><p class="hint" style="font-size:15px">Edit products, prices, photos and website text. Saving sends your changes straight to your GitHub repository, and your website updates by itself.</p>
  <div class="card"><div class="g2"><div class="fld"><label for="l-owner">GitHub username</label><input class="in" id="l-owner" autocomplete="username" value="${esc(o)}"></div><div class="fld"><label for="l-repo">Repository name</label><input class="in" id="l-repo" value="${esc(r)}"></div></div>
  <div class="fld"><label for="l-branch">Branch <small>(usually main)</small></label><input class="in" id="l-branch" value="main"></div>
  <div class="fld"><label for="l-token">Access token</label><input class="in" id="l-token" type="password" autocomplete="current-password" placeholder="github_pat_…"><div class="hint">Needs "Contents: Read and write" for this repository only. Never share it.</div></div>
  <div class="fld"><label class="chk"><input type="checkbox" id="l-rem"> Remember me on this device <small>(only on your own phone or computer)</small></label></div>
  <div class="status ${ui.status?ui.status.t:''}" id="status"${ui.status?'':' hidden'}>${esc(ui.status?ui.status.m:'')}</div>
  <button class="btn pri full" style="margin-top:14px" data-act="login">Log in</button></div></div></div>`;
}
async function login(){
  const f=id=>$('#'+id).value.trim();
  CFG={owner:f('l-owner'),repo:f('l-repo'),branch:f('l-branch')||'main',token:f('l-token'),remember:$('#l-rem').checked};
  if(!CFG.owner||!CFG.repo||!CFG.token){setStatus('err','Enter your username, repository name and token.');return}
  setStatus('info','Checking…');
  try{await loadShop();saveCfg();ui.view='app';ui.status=null;render()}
  catch(e){CFG=null;setStatus('err',errMsg(e))}
}
function logout(){
  if(ui.dirty&&ui.confirm!=='out'){ui.confirm='out';setStatus('err','You have unsaved changes. Press "Log out" again to leave without saving.');return}
  clearCfg();CFG=null;S=null;ui.view='login';ui.dirty=false;ui.confirm='';ui.status=null;ui.edit=null;renderDrawer();render();
}

/* ---------- shell ---------- */
function render(){
  if(ui.view==='login'){document.title='Shop admin';return renderLogin()}
  document.title=(S.shop.name||'Shop')+' · Admin';
  $('#app').innerHTML=`<div class="top"><div class="pad"><div class="in-bar"><b class="t">${esc(S.shop.name||'Shop')} admin</b><span class="dirty" id="dirty"${ui.dirty?'':' hidden'}>Unsaved changes</span><span class="sp"></span><button class="btn sm" id="discard" data-act="discard"${ui.dirty?'':' hidden'}>Discard</button><button class="btn pri" id="savebtn" data-act="save">Save changes</button></div></div></div>
  <div class="pad"><div class="body"><nav class="nav" aria-label="Sections">${PAGES.map(([k,l])=>`<button class="${ui.page===k?'on':''}" data-act="page" data-v="${k}">${l}</button>`).join('')}<hr><a href="../" target="_blank" rel="noopener">View website ↗</a><button data-act="logout">Log out</button></nav>
  <main><div class="status ${ui.status?ui.status.t:''}" id="status"${ui.status?'':' hidden'}>${esc(ui.status?ui.status.m:'')}</div><div id="page">${pageHtml()}</div></main></div></div>`;
  paintBar();
}
const pageHtml=()=>({dash:pDash,products:pProducts,cats:pCats,events:pEvents,site:pSite,contact:pContact,help:pHelp}[ui.page]||pDash)();
function repage(){const p=$('#page');if(p)p.innerHTML=pageHtml()}

/* ---------- pages ---------- */
function pDash(){
  const sh=S.shop,vis=S.products.filter(p=>p.visible!==false).length;
  const todo=[['Add your WhatsApp number',!!sh.whatsapp,'contact'],['Add your phone number',!!sh.phone,'contact'],['Add your Facebook page link',!!sh.facebook,'contact'],['Add at least one product',S.products.length>0,'products'],['Set the order notification email',!!sh.orderEmail,'contact'],['Add bKash or Nagad number (optional)',!!(sh.bkash||sh.nagad),'contact']];
  return `<h2 style="font-size:22px;margin-top:16px">Dashboard</h2>
  <div class="stats"><div class="stat"><b>${S.products.length}</b><span>Products (${vis} visible)</span></div><div class="stat"><b>${S.categories.length}</b><span>Categories</span></div><div class="stat"><b>${S.events.filter(e=>e.active!==false).length}</b><span>Active collections</span></div><div class="stat"><b>${S.products.filter(p=>p.soldOut).length}</b><span>Sold out</span></div></div>
  <div class="card"><h2>Setup checklist</h2><p class="hint">Finish these so customers can reach you.</p>${todo.map(([t,d,p])=>`<div class="todo${d?' done':''}"><i>${d?'✓':''}</i><span>${t}</span>${d?'':`<button class="btn sm" data-act="page" data-v="${p}">Open</button>`}</div>`).join('')}</div>
  <div class="card"><h2>Quick actions</h2><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn pri" data-act="new-p">+ Add a product</button><button class="btn" data-act="page" data-v="site">Edit website text</button><a class="btn" href="../" target="_blank" rel="noopener">View website ↗</a></div></div>
  <div class="note"><b>Orders arrive by email.</b> When a customer confirms an order, the details are sent to <b>${esc(sh.orderEmail||'(no email set yet)')}</b>. The first time, FormSubmit sends an activation email to that address. Place one test order on your website and click the activation link in that email (check Spam too).</div>`;
}
function pProducts(){
  return `<div class="pbar"><input class="in" id="pq" type="search" placeholder="Search by name or code" value="${esc(ui.q)}"><select class="in" id="pf"><option value="">All categories</option>${S.categories.map(c=>`<option value="${c.id}"${ui.fcat===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn pri" data-act="new-p">+ Add product</button></div><div id="plist">${listHtml()}</div>`;
}
function listHtml(){
  const q=ui.q.trim().toLowerCase(),filt=!!(q||ui.fcat);
  const l=S.products.filter(p=>(!ui.fcat||p.cat===ui.fcat)&&(!q||(p.name+' '+p.code).toLowerCase().includes(q)));
  if(!l.length)return `<div class="card" style="text-align:center;color:var(--mute)">${S.products.length?'No products match.':'No products yet. Press "Add product" to create the first one.'}</div>`;
  return l.map(p=>{
    const i=S.products.indexOf(p),c=catOf(p.cat),s=c&&c.subs.find(x=>x.id===p.sub);
    const evs=p.events.map(id=>S.events.find(e=>e.id===id)).filter(Boolean);
    return `<div class="pi${p.visible===false?' hid':''}"><img src="${esc(pImg(p))}" alt=""><div class="pm"><b>${esc(p.name)}</b><small><span class="code">${esc(p.code||'no code')}</span> · ${esc(c?c.name:'No category')}${s?' › '+esc(s.name):''} · ${fmt(p.price)}${p.old>p.price?' <s>'+fmt(p.old)+'</s>':''}</small><div>${p.soldOut?'<span class="chip d">Sold out</span>':''}${p.visible===false?'<span class="chip w">Hidden</span>':''}${p.video?'<span class="chip">Video</span>':''}${evs.map(e=>`<span class="chip">${esc(e.name)}</span>`).join('')}</div></div>
    <div class="acts">${filt?'':`<button class="btn sm" data-act="mv" data-id="${p.id}" data-d="-1" aria-label="Move up"${i===0?' disabled':''}>↑</button><button class="btn sm" data-act="mv" data-id="${p.id}" data-d="1" aria-label="Move down"${i===S.products.length-1?' disabled':''}>↓</button>`}<button class="btn sm pri" data-act="edit-p" data-id="${p.id}">Edit</button><button class="btn sm" data-act="dup-p" data-id="${p.id}">Duplicate</button><button class="btn sm bad" data-act="del-p" data-id="${p.id}">${ui.confirm==='p'+p.id?'Click again to delete':'Delete'}</button></div></div>`;
  }).join('');
}
function pCats(){
  return `<h2 style="font-size:22px;margin-top:16px">Categories</h2><p class="hint">Main categories appear as tabs on your website. Subcategories appear as small buttons once a product uses them.</p>
  ${S.categories.map((c,i)=>`<div class="cat"><div class="crow"><input class="in" data-c="${c.id}" data-f="name" value="${esc(c.name)}" aria-label="Category name"><div class="acts"><button class="btn sm" data-act="cmv" data-id="${c.id}" data-d="-1"${i===0?' disabled':''} aria-label="Move up">↑</button><button class="btn sm" data-act="cmv" data-id="${c.id}" data-d="1"${i===S.categories.length-1?' disabled':''} aria-label="Move down">↓</button><button class="btn sm bad" data-act="cdel" data-id="${c.id}">${ui.confirm==='c'+c.id?'Click again':'Delete'}</button></div></div>
  <label class="chk"><input type="checkbox" data-c="${c.id}" data-f="visible"${c.visible!==false?' checked':''}> Show this category on the website</label>
  <div class="subs">${c.subs.map((s,j)=>`<div class="crow"><input class="in" data-c="${c.id}" data-s="${s.id}" data-f="name" value="${esc(s.name)}" aria-label="Subcategory name"><div class="acts"><button class="btn sm" data-act="smv" data-id="${c.id}" data-s="${s.id}" data-d="-1"${j===0?' disabled':''} aria-label="Move up">↑</button><button class="btn sm" data-act="smv" data-id="${c.id}" data-s="${s.id}" data-d="1"${j===c.subs.length-1?' disabled':''} aria-label="Move down">↓</button><button class="btn sm bad" data-act="sdel" data-id="${c.id}" data-s="${s.id}">${ui.confirm==='s'+s.id?'Click again':'Delete'}</button></div></div>`).join('')}
  <div class="addrow"><input class="in" id="ns-${c.id}" placeholder="New subcategory (e.g. Polo Shirt)"><button class="btn" data-act="sadd" data-id="${c.id}">Add</button></div></div></div>`).join('')}
  <div class="card"><h2>Add a main category</h2><div class="addrow"><input class="in" id="nc" placeholder="e.g. Accessories"><button class="btn pri" data-act="cadd">Add category</button></div></div>`;
}
function pEvents(){
  return `<h2 style="font-size:22px;margin-top:16px">Event collections</h2><p class="hint">These big colored cards appear at the very top of your shop (for example Eid, Puja, Winter). Turn one on only when it has products. Tag products with a collection from the product editor.</p>
  ${S.events.map((e,i)=>`<div class="cat"><div class="er"><input type="color" data-e="${e.id}" data-f="color" value="${esc(e.color||'#243B7A')}" aria-label="Card color"><input class="in" data-e="${e.id}" data-f="name" value="${esc(e.name)}" aria-label="Collection name"></div>
  <div class="crow" style="margin-top:10px"><label class="chk"><input type="checkbox" data-e="${e.id}" data-f="active"${e.active!==false?' checked':''}> Show on website <small>(${S.products.filter(p=>p.events.includes(e.id)).length} products)</small></label><div class="acts"><button class="btn sm" data-act="emv" data-id="${e.id}" data-d="-1"${i===0?' disabled':''} aria-label="Move up">↑</button><button class="btn sm" data-act="emv" data-id="${e.id}" data-d="1"${i===S.events.length-1?' disabled':''} aria-label="Move down">↓</button><button class="btn sm bad" data-act="edel" data-id="${e.id}">${ui.confirm==='e'+e.id?'Click again':'Delete'}</button></div></div></div>`).join('')||'<div class="card hint">No collections yet.</div>'}
  <div class="card"><h2>Add a collection</h2><div class="addrow"><input class="in" id="ne" placeholder="e.g. Eid Collection"><button class="btn pri" data-act="eadd">Add collection</button></div></div>`;
}
const T=(label,key,hint,extra)=>`<div class="fld"><label>${label}${hint?` <small>${hint}</small>`:''}</label><input class="in" data-s="${key}" value="${esc(S.shop[key])}" ${extra||''}></div>`;
const TA=(label,key,hint,list,rows)=>`<div class="fld"><label>${label}${hint?` <small>${hint}</small>`:''}</label><textarea class="in" ${list?'data-sl':'data-s'}="${key}" style="min-height:${rows||90}px">${esc(list?S.shop[key].join('\n'):S.shop[key])}</textarea></div>`;
function imgField(key,label,hint){
  const v=S.shop[key];
  return `<div class="fld"><label>${label} <small>${hint}</small></label><div class="imgf">${v?`<img src="${esc(imgSrc(v))}" alt="">`:''}<button class="btn sm" data-act="shop-img" data-k="${key}">${v?'Replace':'Upload'}</button>${v?`<button class="btn sm bad" data-act="shop-img-rm" data-k="${key}">Remove</button>`:''}</div></div>`;
}
function pSite(){
  return `<h2 style="font-size:22px;margin-top:16px">Website & footer</h2>
  <div class="card"><h2>Brand</h2>${T('Website name','name','(shown in the header and footer)')}${imgField('logo','Logo image','(optional, replaces the letter badge; PNG with transparent background works best)')}${imgField('favicon','Website icon (favicon)','(small square icon shown in the browser tab; if empty, the logo is used)')}${imgField('ogImage','Link preview image','(shown when your link is shared on WhatsApp/Facebook; best size 1200\u00d7630. If empty, the logo is used)')}
  <div class="fld"><label>Brand color <small>(buttons, marquee strip. Pick a dark color)</small></label><input type="color" data-s="brandColor" value="${esc(S.shop.brandColor||'#1E3A8A')}"></div>
  ${imgField('waIcon','Chat button icon','(optional image for the floating WhatsApp button)')}</div>
  <div class="card"><h2>Marquee announcement</h2><p class="hint">The moving text strip right under the header.</p>${TA('Messages','marquee','(one per line)',true,100)}</div>
  <div class="card"><h2>Top section (hero)</h2>${T('Small label','heroEyebrow','(e.g. New collection)')}${T('Big heading','heroTitle','')}${TA('Short text','heroSub','',false,70)}${T('Button text','heroBtn','')}${TA('Highlights','perks','(one per line, shown with ticks)',true,80)}<p class="hint">Photos in the hero come from products marked "Show in hero". If none are marked, the first three products are used.</p></div>
  <div class="card"><h2>Footer</h2>${TA('About text','about','',false,70)}${TA('Policies / info lines','policies','(one per line)',true,100)}${T('Copyright text','copyright','(use {year} for the current year)')}${T('Tagline','tagline','(also used for search engines)')}</div>`;
}

  return `<h2 style="font-size:22px;margin-top:16px">Contact & orders</h2>
  <div class="card"><h2>Contact details</h2><p class="hint">Shown in the footer. The WhatsApp number also powers the floating chat button.</p>
  <div class="g2">${T('Contact email','contactEmail','')}${T('Phone number','phone','','inputmode="tel" placeholder="01XXXXXXXXX"')}</div>
  <div class="g2">${T('WhatsApp number','whatsapp','','inputmode="tel" placeholder="01XXXXXXXXX"')}${T('Facebook page link','facebook','','placeholder="https://facebook.com/yourpage"')}</div>${T('Shop address','address','(optional)')}</div>
  <div class="card"><h2>New order email (EmailJS, recommended)</h2><p class="hint">Fill all three to send order emails with the free EmailJS service. Your email address stays inside your EmailJS account, not in the website files. The Public Key is safe to put here.</p><div class="g3">${T('Service ID','emailjsService','(service_xxxxxxx)')}${T('Template ID','emailjsTemplate','(template_xxxxxxx)')}${T('Public Key','emailjsKey','(from Account → General)')}</div></div>
  <div class="card"><h2>Backup order email (FormSubmit)</h2><p class="hint">Used only when the three EmailJS boxes above are empty. Uses the free FormSubmit service.</p>${T('Send orders to','orderEmail','(your email, or the secret key FormSubmit gives you)')}
  <div class="note"><b>First time only:</b> place a test order on your website. FormSubmit emails an activation link to this address. Click it (check Spam). After activating, you can paste FormSubmit's random key here instead of your email, so your address is not visible in the website files.</div></div>
  <div class="card"><h2>Payments</h2><p class="hint">Customers can always choose cash on delivery. Add numbers to also offer advance payment.</p><div class="g2">${T('bKash number','bkash','(personal)','inputmode="tel"')}${T('Nagad number','nagad','(personal)','inputmode="tel"')}</div></div>
  <div class="card"><h2>Delivery charge</h2><div class="g3">${T('Inside Dhaka (৳)','feeIn','','data-n inputmode="numeric"')}${T('Outside Dhaka (৳)','feeOut','','data-n inputmode="numeric"')}${T('Free delivery above (৳)','freeOver','(0 = off)','data-n inputmode="numeric"')}</div></div>`;
}
function pHelp(){
  return `<h2 style="font-size:22px;margin-top:16px">Help</h2>
  <div class="card"><h2>Everyday tasks</h2><ol class="help">
  <li><b>Change a price or text:</b> open <i>Products</i>, press Edit, change it, close the editor, then press <b>Save changes</b> at the top.</li>
  <li><b>Add a product:</b> Products → Add product. Fill the name, price and category, give it an event collection if you want, add 2–4 photos for each color, then Save.</li>
  <li><b>Different colors:</b> in the product editor press "Add another color" and give each color its own photos. Customers pick the color on the website.</li>
  <li><b>Video:</b> upload one MP4 (under 25 MB) or paste a YouTube link. It appears last in the photo gallery.</li>
  <li><b>Product code:</b> every product has a code (like RB-101). It is printed in the order email so you know exactly what was ordered.</li>
  <li><b>Categories and collections:</b> manage them from their own pages. A product belongs to one category (and optionally one subcategory) and can be in several collections.</li>
  <li><b>Hide or sell out:</b> use "Show on website" and "Sold out" in the product editor.</li>
  <li><b>Nothing changes until you press Save changes.</b> After saving, wait 1–2 minutes and refresh the website.</li></ol></div>
  <div class="card"><h2>Orders</h2><p class="hint">Orders are not stored in this panel. Every confirmed order is sent to your order email, and customers can also message you on WhatsApp.</p></div>
  <div class="card"><h2>Safety</h2><p class="hint">Your access token is the key to your repository. Keep it private. If it leaks, delete it in GitHub (Settings → Developer settings) and create a new one.</p></div>`;
}

/* ---------- product drawer ---------- */
function renderDrawer(){
  const D=$('#drawer'),sc=D.querySelector('.db'),top=sc?sc.scrollTop:0;
  const p=ui.edit?prod(ui.edit):null;
  if(!p){D.innerHTML='';document.documentElement.classList.remove('lock');ui.drawerKey='';return}
  D.innerHTML=drawerHtml(p);
  document.documentElement.classList.add('lock');
  const same=ui.drawerKey===p.id;
  if(same){$('.dov',D).classList.add('still');$('.db',D).scrollTop=top}
  ui.drawerKey=p.id;
}
function dupCode(p){return !!p.code.trim()&&S.products.some(x=>x!==p&&x.code.trim().toLowerCase()===p.code.trim().toLowerCase())}
function drawerHtml(p){
  const c=catOf(p.cat);
  const fld=(l,inner,h)=>`<div class="fld"><label>${l}${h?` <small>${h}</small>`:''}</label>${inner}</div>`;
  const pf=(f,v,extra)=>`<input class="in" data-p="${p.id}" data-f="${f}" value="${esc(v)}" ${extra||''}>`;
  return `<div class="dov" data-act="dclose"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Edit product"><div class="dh"><b>Edit product</b><span class="code" style="color:var(--mute)">${esc(p.code)}</span><button class="x" data-act="dclose" aria-label="Close">×</button></div>
  <div class="db">
  <div class="sec"><h3>Basics</h3><div class="g2">${fld('Product code',pf('code',p.code,'id="pcode"')+`<div class="hint" id="codehint" style="color:var(--bad)">${dupCode(p)?'This code is already used by another product.':''}</div>`,'(you see this in order emails)')}${fld('Product name',pf('name',p.name))}</div>
  <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px"><label class="chk"><input type="checkbox" data-p="${p.id}" data-f="visible"${p.visible!==false?' checked':''}> Show on website</label><label class="chk"><input type="checkbox" data-p="${p.id}" data-f="soldOut"${p.soldOut?' checked':''}> Sold out</label><label class="chk"><input type="checkbox" data-p="${p.id}" data-f="featured"${p.featured?' checked':''}> Show in hero</label></div></div>
  <div class="sec"><h3>Where it appears</h3><div class="g2">${fld('Category',`<select class="in" data-p="${p.id}" data-f="cat"><option value="">Choose…</option>${S.categories.map(x=>`<option value="${x.id}"${x.id===p.cat?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}
  ${fld('Subcategory',`<select class="in" data-p="${p.id}" data-f="sub"><option value="">None</option>${(c?c.subs:[]).map(x=>`<option value="${x.id}"${x.id===p.sub?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}</div>
  <div class="lbl">Event collections</div><div class="evchk">${S.events.map(e=>`<label class="chk"><input type="checkbox" data-p="${p.id}" data-f="event" data-ev="${e.id}"${p.events.includes(e.id)?' checked':''}> ${esc(e.name)}</label>`).join('')||'<span class="hint">No collections created yet.</span>'}</div></div>
  <div class="sec"><h3>Price & sizes</h3><div class="g2">${fld('Selling price (৳)',pf('price',p.price||'','inputmode="numeric"'))}${fld('Old price (৳)',pf('old',p.old||'','inputmode="numeric"'),'(shows a discount; leave empty for none)')}</div>${fld('Sizes',pf('sizes',p.sizes.join(', ')),'(separate with commas, e.g. M, L, XL. Leave empty if sizes do not apply)')}
  ${fld('Badge text',pf('badge',p.badge||''),'(optional, e.g. New)')}</div>
  <div class="sec"><h3>Description</h3><textarea class="in" data-p="${p.id}" data-f="desc" style="min-height:110px">${esc(p.desc)}</textarea></div>
  <div class="sec"><h3>Colors & photos</h3><p class="hint" style="margin:0">Add 2–4 photos for each color. If the product has only one color, keep a single entry. Customers pick a color on the website only when there is more than one.</p>
  ${p.variants.map(v=>`<div class="var"><div class="vh"><input class="in" data-p="${p.id}" data-v="${v.id}" data-f="vname" placeholder="Color name, e.g. Black" value="${esc(v.name)}" aria-label="Color name"><input type="color" data-p="${p.id}" data-v="${v.id}" data-f="vhex" value="${esc(v.hex||'#888888')}" aria-label="Color"><button class="btn sm bad" data-act="del-v" data-p="${p.id}" data-v="${v.id}"${p.variants.length<2?' disabled':''}>Remove</button></div>
  <div class="imgs">${v.imgs.map((s,i)=>`<div class="im"><img src="${esc(imgSrc(s))}" alt="Photo ${i+1}" data-act="rep-img" data-p="${p.id}" data-v="${v.id}" data-i="${i}" title="Click to replace"><button data-act="rm-img" data-p="${p.id}" data-v="${v.id}" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')}${v.imgs.length<4?`<button class="add" data-act="add-img" data-p="${p.id}" data-v="${v.id}">+ Photo</button>`:''}</div></div>`).join('')}
  <button class="btn" data-act="add-v" data-p="${p.id}">+ Add another color</button></div>
  <div class="sec"><h3>Video <small class="hint">(optional, shown last in the gallery)</small></h3>${p.video?`<p style="margin:6px 0"><span class="chip">${p.video.indexOf('videos/')===0?'Uploaded video':'Link'}</span> <span class="hint" style="word-break:break-all">${esc(p.video)}</span></p>`:''}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="up-video" data-p="${p.id}">Upload MP4</button>${p.video?`<button class="btn bad" data-act="rm-video" data-p="${p.id}">Remove video</button>`:''}</div>
  ${fld('Or paste a YouTube / video link',pf('video',p.video&&p.video.indexOf('videos/')===0?'':(p.video||''),'placeholder="https://youtu.be/…"'),'')}<p class="hint">Uploaded videos must be under 25 MB. For bigger videos, upload to YouTube and paste the link.</p></div>
  </div><div class="df"><button class="btn" data-act="dup-p" data-id="${p.id}">Duplicate</button><button class="btn pri" data-act="dclose">Done</button></div></aside></div>`;
}

/* ---------- files ---------- */
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function prepImage(file,max,alpha){
  const src=await readFile(file),img=await loadImg(src);
  const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext('2d');
  const png=alpha&&/png|svg/.test(file.type);
  if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL(png?'image/png':'image/jpeg',0.82);
  let color=null;try{color=detectColor(c)}catch(e){}
  return {url,b64:url.split(',')[1],ext:png?'png':'jpg',color};
}
let lastColor=null;
const CNAMES=[['কালো',[22,22,24]],['সাদা',[242,242,240]],['ধূসর',[135,135,138]],['ছাই রঙ',[190,190,192]],['লাল',[205,30,40]],['মেরুন',[105,20,38]],['গোলাপি',[240,125,170]],['কমলা',[240,130,30]],['হলুদ',[242,208,45]],['সবুজ',[40,150,70]],['বোতল সবুজ',[15,77,58]],['অলিভ',[110,115,50]],['হালকা সবুজ',[165,205,135]],['আকাশি',[125,190,235]],['নীল',[30,90,200]],['নেভি ব্লু',[25,35,85]],['টিল',[0,130,130]],['বেগুনি',[120,60,160]],['লিলাক',[190,155,210]],['বাদামি',[120,75,45]],['কফি',[85,55,40]],['বেইজ',[222,203,168]],['ক্রিম',[242,232,205]]];
function colorName(r,g,b){let best='',bd=1e9;CNAMES.forEach(([n,c])=>{const rm=(r+c[0])/2,dr=r-c[0],dg=g-c[1],db=b-c[2],d=(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;if(d<bd){bd=d;best=n}});return best}
function detectColor(src){
  const W=48,c=document.createElement('canvas');c.width=c.height=W;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,W);
  const d=x.getImageData(0,0,W,W).data,px=[];let br=0,bg=0,bb=0,bn=0;
  for(let j=0;j<W;j++)for(let i=0;i<W;i++){const k=(j*W+i)*4,p=[d[k],d[k+1],d[k+2]];
    if(i<3||j<3||i>=W-3||j>=W-3){br+=p[0];bg+=p[1];bb+=p[2];bn++}
    else if(i>=W*.2&&i<W*.8&&j>=W*.12&&j<W*.88)px.push(p)}
  const B=[br/bn,bg/bn,bb/bn],far=px.filter(p=>Math.hypot(p[0]-B[0],p[1]-B[1],p[2]-B[2])>50),use=far.length>px.length*.12?far:px;
  const bins={};use.forEach(p=>{const k=(p[0]>>5)+'-'+(p[1]>>5)+'-'+(p[2]>>5);(bins[k]=bins[k]||[]).push(p)});
  const top=Object.values(bins).sort((a,b)=>b.length-a.length)[0];if(!top)return null;
  const m=[0,1,2].map(t=>Math.round(top.reduce((a,p)=>a+p[t],0)/top.length));
  return {hex:'#'+m.map(v=>v.toString(16).padStart(2,'0')).join(''),name:colorName(m[0],m[1],m[2])};
}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files&&i.files[0])cb(i.files[0])};i.click()}
async function newImage(max,alpha,prefix){
  return new Promise(res=>pickFile('image/*',async f=>{
    try{const r=await prepImage(f,max,alpha);const path='images/'+prefix+uid()+Date.now().toString(36)+'.'+r.ext;pending[path]={b64:r.b64};previews[path]=r.url;lastColor=r.color;res(path)}
    catch(e){setStatus('err','That image could not be read. Try a different file.');res(null)}
  }));
}
function newVideo(){
  return new Promise(res=>pickFile('video/mp4,video/webm,video/*',async f=>{
    if(f.size>25*1024*1024){toast('Video is too big (max 25 MB)');return res(null)}
    try{const u=await readFile(f);const path='videos/'+uid()+Date.now().toString(36)+(/webm/.test(f.type)?'.webm':'.mp4');pending[path]={b64:u.split(',')[1]};previews[path]=URL.createObjectURL(f);res(path)}
    catch(e){toast('Video could not be read');res(null)}
  }));
}

/* ---------- actions ---------- */
const fixed=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return false;[a[i],a[j]]=[a[j],a[i]];return true};
function newProduct(){
  const c=S.categories[0];
  const p={id:'p'+uid(),code:nextCode(),name:'New product',cat:c?c.id:'',sub:'',events:[],price:0,old:0,sizes:['M','L','XL','XXL'],desc:'',soldOut:false,visible:true,featured:false,badge:'',video:'',variants:[{id:'v'+uid(),name:'Default',hex:'#888888',imgs:[]}]};
  S.products.unshift(p);markDirty();ui.page='products';ui.edit=p.id;render();renderDrawer();
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,d=+el.dataset.d;
  if(a==='dclose'&&el.classList.contains('dov')&&e.target!==el)return;
  switch(a){
    case 'login':login();break;
    case 'logout':logout();break;
    case 'save':save();break;
    case 'discard':discard();break;
    case 'page':ui.page=el.dataset.v;ui.confirm='';render();window.scrollTo({top:0});break;
    case 'new-p':newProduct();break;
    case 'edit-p':ui.edit=id;renderDrawer();break;
    case 'dclose':ui.edit=null;renderDrawer();repage();break;
    case 'mv':if(fixed(S.products,S.products.findIndex(x=>x.id===id),d)){markDirty();repage()}break;
    case 'dup-p':{const p=prod(id),n=JSON.parse(JSON.stringify(p));n.id='p'+uid();n.code=nextCode();n.name=p.name+' (copy)';n.variants.forEach(v=>v.id='v'+uid());S.products.splice(S.products.indexOf(p)+1,0,n);markDirty();ui.edit=n.id;ui.page='products';render();renderDrawer();break}
    case 'del-p':if(ui.confirm==='p'+id){S.products=S.products.filter(x=>x.id!==id);ui.confirm='';markDirty()}else ui.confirm='p'+id;repage();break;
    case 'add-v':{const p=prod(el.dataset.p);p.variants.push({id:'v'+uid(),name:'',hex:'#888888',imgs:[]});markDirty();renderDrawer();break}
    case 'del-v':{const p=prod(el.dataset.p);if(p.variants.length>1){p.variants=p.variants.filter(v=>v.id!==el.dataset.v);markDirty();renderDrawer()}break}
    case 'add-img':{const v=prod(el.dataset.p).variants.find(x=>x.id===el.dataset.v);const first=!v.imgs.length,path=await newImage(900,false,'');if(path){v.imgs.push(path);if(lastColor&&(first||!v.name)){const nm=(v.name||'').trim();if(!nm||nm==='Default'){v.name=lastColor.name;v.hex=lastColor.hex}else if(first){v.hex=lastColor.hex}toast('Color detected: '+lastColor.name+' (you can change it)')}markDirty();renderDrawer()}break}
    case 'rep-img':{const v=prod(el.dataset.p).variants.find(x=>x.id===el.dataset.v);const path=await newImage(900,false,'');if(path){v.imgs[+el.dataset.i]=path;markDirty();renderDrawer()}break}
    case 'rm-img':{const v=prod(el.dataset.p).variants.find(x=>x.id===el.dataset.v);v.imgs.splice(+el.dataset.i,1);markDirty();renderDrawer();break}
    case 'up-video':{const p=prod(el.dataset.p);const path=await newVideo();if(path){p.video=path;markDirty();renderDrawer()}break}
    case 'rm-video':{prod(el.dataset.p).video='';markDirty();renderDrawer();break}
    case 'shop-img':{const k=el.dataset.k;const path=await newImage(k==='logo'?600:k==='ogImage'?1200:k==='favicon'?256:200,k!=='ogImage',k+'-');if(path){S.shop[k]=path;markDirty();repage()}break}
    case 'shop-img-rm':S.shop[el.dataset.k]='';markDirty();repage();break;
    case 'cadd':{const i=$('#nc'),v=i.value.trim();if(!v)break;S.categories.push({id:'c'+uid(),name:v,visible:true,subs:[]});markDirty();repage();break}
    case 'sadd':{const i=$('#ns-'+id),v=i.value.trim();if(!v)break;catOf(id).subs.push({id:'s'+uid(),name:v});markDirty();repage();break}
    case 'cmv':if(fixed(S.categories,S.categories.findIndex(x=>x.id===id),d)){markDirty();repage()}break;
    case 'smv':{const c=catOf(id);if(fixed(c.subs,c.subs.findIndex(x=>x.id===el.dataset.s),d)){markDirty();repage()}break}
    case 'cdel':if(ui.confirm==='c'+id){S.products.forEach(p=>{if(p.cat===id){p.cat='';p.sub=''}});S.categories=S.categories.filter(x=>x.id!==id);ui.confirm='';markDirty()}else ui.confirm='c'+id;repage();break;
    case 'sdel':{const s=el.dataset.s;if(ui.confirm==='s'+s){S.products.forEach(p=>{if(p.sub===s)p.sub=''});catOf(id).subs=catOf(id).subs.filter(x=>x.id!==s);ui.confirm='';markDirty()}else ui.confirm='s'+s;repage();break}
    case 'eadd':{const i=$('#ne'),v=i.value.trim();if(!v)break;S.events.push({id:'e'+uid(),name:v,color:'#243B7A',active:false});markDirty();repage();break}
    case 'emv':if(fixed(S.events,S.events.findIndex(x=>x.id===id),d)){markDirty();repage()}break;
    case 'edel':if(ui.confirm==='e'+id){S.products.forEach(p=>{p.events=p.events.filter(x=>x!==id)});S.events=S.events.filter(x=>x.id!==id);ui.confirm='';markDirty()}else ui.confirm='e'+id;repage();break;
  }
});
function onField(e){
  const el=e.target,ch=e.type==='change';
  if(el.id==='pq'){ui.q=el.value;const l=$('#plist');if(l)l.innerHTML=listHtml();return}
  if(el.id==='pf'){ui.fcat=el.value;const l=$('#plist');if(l)l.innerHTML=listHtml();return}
  if(el.dataset.p){
    const p=prod(el.dataset.p);if(!p)return;const f=el.dataset.f;
    if(f==='name')p.name=el.value;
    else if(f==='code'){p.code=el.value;const h=$('#codehint');if(h)h.textContent=dupCode(p)?'This code is already used by another product.':''}
    else if(f==='desc')p.desc=el.value;
    else if(f==='badge')p.badge=el.value;
    else if(f==='price')p.price=num(el.value);
    else if(f==='old')p.old=num(el.value);
    else if(f==='sizes')p.sizes=el.value.split(/[,،\s]+/).map(x=>x.trim()).filter(Boolean);
    else if(f==='video'){if(el.value.trim()||!(p.video||'').startsWith('videos/'))p.video=el.value.trim()}
    else if(f==='visible')p.visible=el.checked;
    else if(f==='soldOut')p.soldOut=el.checked;
    else if(f==='featured')p.featured=el.checked;
    else if(f==='cat'){p.cat=el.value;const c=catOf(p.cat);if(!c||!c.subs.some(s=>s.id===p.sub))p.sub='';markDirty();renderDrawer();return}
    else if(f==='sub')p.sub=el.value;
    else if(f==='event'){const id=el.dataset.ev;p.events=p.events.filter(x=>x!==id);if(el.checked)p.events.push(id)}
    else if(f==='vname'){p.variants.find(v=>v.id===el.dataset.v).name=el.value}
    else if(f==='vhex'){p.variants.find(v=>v.id===el.dataset.v).hex=el.value}
    markDirty();return;
  }
  if(el.dataset.c){
    const c=catOf(el.dataset.c);if(!c)return;
    if(el.dataset.s){c.subs.find(s=>s.id===el.dataset.s).name=el.value}
    else if(el.dataset.f==='visible')c.visible=el.checked;else c.name=el.value;
    markDirty();return;
  }
  if(el.dataset.e){
    const ev=S.events.find(x=>x.id===el.dataset.e);if(!ev)return;
    const f=el.dataset.f;if(f==='active')ev.active=el.checked;else ev[f]=el.value;
    markDirty();return;
  }
  if('s' in el.dataset||'sl' in el.dataset){
    const k=el.dataset.s||el.dataset.sl;
    if('sl' in el.dataset)S.shop[k]=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
    else if('n' in el.dataset)S.shop[k]=num(el.value);
    else S.shop[k]=el.value;
    markDirty();
    if(k==='name'){document.title=(el.value||'Shop')+' · Admin';const t=$('.top b.t');if(t)t.textContent=(el.value||'Shop')+' admin'}
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&ui.view==='login'&&e.target.matches('input'))login();
  if(e.key==='Escape'&&ui.edit){ui.edit=null;renderDrawer();repage()}
});
window.addEventListener('beforeunload',e=>{if(ui.dirty){e.preventDefault();e.returnValue=''}});

/* ---------- start ---------- */
(async()=>{
  CFG=loadCfg();
  if(CFG&&CFG.token){
    ui.view='login';renderLogin();setStatus('info','Loading…');
    try{await loadShop();ui.view='app';ui.status=null;render()}
    catch(e){const m=errMsg(e);CFG=null;ui.view='login';renderLogin();setStatus('err',m)}
  }else{CFG=null;render()}
})();
})();
</script>
