<style>
/* Layout: white storefront. Sticky header, marquee strip, hero with floating product photos, event cards, category tabs, product grid, dark footer, floating chat button. Royal indigo brand (admin editable) with a small gold accent. */
:root{--bg:#fff;--soft:#F4F6FB;--ink:#0E1630;--mute:#58627A;--line:#E5E8F0;--brand:#1E3A8A;--brand-ink:#fff;--gold:#C8962C;--sale:#C0301C;--ok:#0F8A5F;--wa:#1FA855;--warn:#FFF4D6;--warn-ink:#6B4A00;--shadow:0 20px 60px rgba(14,22,48,.18);--f-d:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;--f-b:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-text-size-adjust:100%}
img,video,iframe{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;line-height:1.25}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.boot{padding:90px 16px;text-align:center;color:var(--mute)}
/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 21px/1 var(--f-d);letter-spacing:.03em;min-width:0}
.brand img{height:36px;width:auto;display:block}
.brand .mk{flex:none;width:32px;height:32px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:17px}
.brand .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hnav{display:flex;align-items:center;gap:6px}
.hl{border:0;background:none;padding:8px 12px;font-weight:600;border-radius:10px}
.hl:hover{background:var(--soft)}
.cartbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600}
.cartbtn svg{width:19px;height:19px}
.cnt{background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.cartbtn.bump{animation:bump .5s}
@media(max-width:560px){.hl{display:none}}
/* marquee */
.mq{background:var(--brand);color:var(--brand-ink);overflow:hidden;font-size:14.5px}
.mq-track{display:flex;width:max-content;animation:mq var(--mqd,40s) linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-g{display:flex;flex:none}
.mq-i{display:flex;align-items:center;white-space:nowrap;padding:8px 0}
.mq-i::after{content:"";width:6px;height:6px;margin:0 28px;transform:rotate(45deg);background:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}
/* hero */
.hero{position:relative;overflow:hidden;padding:30px 0 20px}
.hero::before{content:"";position:absolute;right:-14%;top:-32%;width:min(64vmax,760px);height:min(64vmax,760px);border-radius:50%;background:radial-gradient(closest-side,var(--brand),transparent);opacity:.09}
.hero-in{position:relative;display:grid;gap:22px;align-items:center}
@media(min-width:880px){.hero-in{grid-template-columns:1.05fr .95fr;gap:40px}.hero{padding:46px 0 30px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--brand);background:var(--soft);padding:5px 14px;border-radius:999px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.hero h1{font-size:clamp(30px,6.2vw,54px);font-weight:800;line-height:1.18;margin:14px 0 12px;text-wrap:balance}
.hero .sub{color:var(--mute);max-width:34em;font-size:17px;margin:0 0 20px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.perks{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0;margin:20px 0 0;color:var(--mute);font-size:14.5px}
.perks li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:6px}
.hero-art{position:relative;height:300px}
@media(min-width:880px){.hero-art{height:430px}}
.hi{position:absolute;border:0;padding:0;background:var(--soft);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);animation:float 6.5s ease-in-out infinite}
.hi img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.hi:nth-child(1){width:44%;aspect-ratio:3/4;left:4%;top:12%;rotate:-5deg}
.hi:nth-child(2){width:46%;aspect-ratio:3/4;right:3%;top:0;rotate:4deg;animation-delay:-2.2s}
.hi:nth-child(3){width:38%;aspect-ratio:3/4;left:34%;bottom:0;rotate:-1deg;animation-delay:-4.2s;z-index:2}
@keyframes float{50%{translate:0 -12px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:12px 20px;font-weight:700;text-decoration:none;text-align:center;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(14,22,48,.14)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:var(--line);font-weight:600}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.full{display:flex;width:100%}
.btn[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
/* shop */
.shop{padding:18px 0 34px;scroll-margin-top:66px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:21px;font-weight:800}
.evs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;scrollbar-width:none}
.evs::-webkit-scrollbar{display:none}
.ev{flex:0 0 min(78%,260px);scroll-snap-align:start;position:relative;overflow:hidden;text-align:left;border:0;border-radius:18px;padding:16px;color:#fff;background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 52%,#000));display:flex;flex-direction:column;gap:2px;min-height:108px;transition:transform .25s,box-shadow .25s}
.ev::after{content:"";position:absolute;right:-26px;bottom:-38px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.15)}
.ev small{opacity:.85;font-size:12.5px;letter-spacing:.05em}
.ev b{font:700 19px/1.25 var(--f-d)}
.ev span{margin-top:auto;font-size:13.5px;opacity:.92}
.ev:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(14,22,48,.24)}
.ev.on{outline:3px solid var(--ink);outline-offset:2px}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding:6px 2px 10px;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;scroll-snap-align:center;border:2px solid var(--brand);background:#fff;padding:10px 20px;border-radius:999px;font-weight:700;font-size:16px;color:var(--brand);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.tab::after{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-weight:500;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.srch{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;min-height:46px}
.srch svg{flex:none;width:18px;height:18px;color:var(--mute)}
.srch input{border:0;outline:0;background:none;width:100%;min-height:42px}
.srch:focus-within{border-color:var(--brand)}
.tools select{border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;background:#fff}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mute);font-size:14.5px;margin:10px 0 2px;min-height:26px}
.lnk{background:none;border:0;color:var(--brand);font-weight:600;text-decoration:underline;padding:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;padding:12px 0}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 18px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{cursor:pointer;min-width:0;text-align:left;border:0;background:none;padding:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;align-self:stretch}
.card .ph{width:100%;flex:none}
.card .meta{flex:1}
.ph{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--soft)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;transition:transform .5s,opacity .4s}
.ph img.b{opacity:0}
@media(hover:hover){.card:hover .ph img.a{transform:scale(1.05)}.card:hover .ph img.b{opacity:1;transform:scale(1.03)}}
.tag{position:absolute;left:10px;top:10px;z-index:2;background:var(--sale);color:#fff;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px}
.tag.so{background:var(--ink)}
.tag.bd{background:var(--gold);color:#1b1405;top:auto;bottom:10px}
.card .meta{padding:10px 2px 0}
.pcode{font-size:12.5px;color:var(--mute);letter-spacing:.04em}
.card h3{font-size:16.5px;font-weight:700;line-height:1.35;min-height:2.7em;margin:1px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pr b{font-size:17.5px}
.pr s{color:var(--mute);font-size:14px}
.pr em{font-style:normal;color:var(--sale);font-weight:600;font-size:14px}
.dots{display:flex;gap:5px;margin-top:7px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(100,110,130,.5)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 10px;background:var(--soft);border-radius:16px}
.rv{opacity:0;translate:0 20px;transition:opacity .6s cubic-bezier(.2,.7,.2,1),translate .6s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*55ms)}
.rv.vis{opacity:1;translate:none}
/* how */
.how{background:var(--soft);padding:34px 0}
.steps{display:grid;gap:14px;margin-top:14px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{display:flex;gap:14px;background:#fff;border-radius:16px;padding:18px;align-items:flex-start;border:1px solid var(--line)}
.step i{flex:none;font:800 20px/1 var(--f-d);font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.step b{display:block;font-family:var(--f-d);font-size:17px}
.step span{color:var(--mute);font-size:15px}
/* footer */
.foot{background:var(--ink);color:#C9D0E2;padding:38px 0 0}
.fg{display:grid;gap:26px}
@media(min-width:820px){.fg{grid-template-columns:1.3fr 1fr 1.2fr 1.2fr}}
.foot h4{color:#fff;font-size:16px;margin-bottom:10px}
.foot .fb{font:800 22px var(--f-d);color:#fff;letter-spacing:.03em;margin-bottom:8px}
.foot p{margin:0;font-size:15px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:15px}
.foot a,.foot .fl{color:#C9D0E2;text-decoration:none;background:none;border:0;padding:0;text-align:left}
.foot a:hover,.foot .fl:hover{color:#fff;text-decoration:underline}
.copy{margin-top:30px;border-top:1px solid rgba(255,255,255,.12);padding:16px 0 calc(22px + env(safe-area-inset-bottom,0px));font-size:14px;color:#9AA3BA;text-align:center}
@media(max-width:600px){.copy{padding-bottom:84px}}
/* floating chat */
.wa{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;border-radius:999px;padding:13px;box-shadow:0 10px 26px rgba(15,138,95,.4);animation:pulse 2.6s infinite}
.wa svg{width:28px;height:28px;display:block}
.wa img{width:30px;height:30px;object-fit:contain;display:block;border-radius:50%}
.wa span{display:none;font-weight:700;padding-right:6px}
@media(min-width:760px){.wa span{display:block}.wa{padding:13px 16px 13px 14px}}
.wa:hover{transform:translateY(-3px)}
html.lock .wa{display:none}
@keyframes pulse{0%{box-shadow:0 10px 26px rgba(15,138,95,.4),0 0 0 0 rgba(31,168,85,.5)}70%{box-shadow:0 10px 26px rgba(15,138,95,.4),0 0 0 16px rgba(31,168,85,0)}100%{box-shadow:0 10px 26px rgba(15,138,95,.4),0 0 0 0 rgba(31,168,85,0)}}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,16,32,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{position:relative;background:#fff;width:100%;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:20px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));outline:0;animation:up .32s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
.still,.still .sheet{animation:none}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:22px;max-width:580px;max-height:90vh;max-height:90dvh;animation-name:pop;padding:26px}.sheet.pd{max-width:1000px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{translate:0 46px;opacity:.4}}
@keyframes pop{from{scale:.96;opacity:0}}
@keyframes bump{30%{scale:1.14}60%{scale:.96}}
.x{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:24px;line-height:1;z-index:5}
.x:hover{background:var(--line)}
.pd{display:grid;gap:18px;align-content:start}
@media(min-width:760px){.pd{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px}}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--soft);aspect-ratio:4/5;max-height:62vh;display:grid;place-items:center}
@media(min-width:760px){.stage{max-height:none}}
.stage img{width:100%;height:100%;object-fit:cover;object-position:center 15%;animation:fade .35s both}
.stage video,.stage iframe{width:100%;height:100%;border:0;background:#000}
.ar{position:absolute;top:50%;translate:0 -50%;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:24px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:3}
.ar.l{left:10px}.ar.r{right:10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.th{flex:none;width:60px;height:74px;border-radius:10px;border:2px solid transparent;padding:0;overflow:hidden;background:var(--soft);position:relative}
.th img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.th.on{border-color:var(--brand)}
.th .play{position:absolute;inset:0;background:#0E1630;display:grid;place-items:center}
.th .play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.th small{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#fff;font-size:11px}
.info-p h2{font-size:26px;font-weight:800;padding-right:44px;margin:4px 0 6px}
.crumb{font-size:13.5px;color:var(--mute)}
.info-p .pr b{font-size:26px}
.desc{color:var(--mute);margin:12px 0 4px}

.sheet h2.t{font-size:24px;font-weight:800;padding-right:46px;margin-bottom:10px}

.row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row img{width:70px;height:88px;object-fit:cover;object-position:center 15%;border-radius:10px;display:block}
.row b{display:block;line-height:1.35}
.row small{color:var(--mute)}
.row .rr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}

.sum .tot{font-size:20px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.fld{margin:12px 0}
.fld label{display:block;font-weight:600;margin-bottom:5px}
.fld label small{font-weight:400;color:var(--mute)}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-height:46px}
.in:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,58,138,.14)}

.in.invalid{border-color:var(--sale)}

@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-weight:500;cursor:pointer;margin:0}
.pay input{accent-color:var(--brand);width:18px;height:18px}
.pay label:has(input:checked){border-color:var(--brand);background:var(--soft)}
.note{background:var(--warn);color:var(--warn-ink);border-radius:11px;padding:11px 13px;font-size:14.5px;margin:12px 0}
.note.bad{background:#FDECE8;color:#8A2413}
.box{background:var(--soft);border-radius:14px;padding:13px 15px;margin:10px 0;font-size:15px}

.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em}
.okc{display:grid;place-items:center;margin:6px 0 10px}
.okc svg{width:76px;height:76px}

.okc path{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.center{text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:90;font-weight:600;max-width:90vw;text-align:center;animation:up .3s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;translate:none}html{scroll-behavior:auto}}
.secs{display:block;padding:0 0 12px}
.catbar{margin:30px 0 4px;padding:15px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;text-align:center}
.subt{font-size:17px;font-weight:800;margin:22px 0 0;padding-left:10px;border-left:4px solid var(--brand)}
.more{text-align:center;margin:2px 0 8px}
.morebtn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;padding:9px 24px;font-weight:700;font-size:15px;transition:.2s}
.morebtn:hover{background:var(--brand);color:#fff}
.ph{background:linear-gradient(100deg,var(--soft) 30%,#fff 50%,var(--soft) 70%) 0 0/200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media(min-width:720px){.secs .grid{grid-template-columns:repeat(4,minmax(0,1fr))}.catbar{font-size:21px;padding:17px}}
/* full-page product / cart / checkout */
.ov{background:#fff;align-items:stretch;justify-content:stretch;padding:0;animation:none}
.sheet,.sheet.pd{max-width:none;width:100%;max-height:none;height:100%;border-radius:0;box-shadow:none;padding-top:max(22px,env(safe-area-inset-top,0px));padding-left:max(16px,calc((100% - 1000px)/2));padding-right:max(16px,calc((100% - 1000px)/2))}
.sheet:not(.pd){padding-left:max(16px,calc((100% - 640px)/2));padding-right:max(16px,calc((100% - 640px)/2))}
.x{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));box-shadow:0 2px 10px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="app"><div class="boot">লোড হচ্ছে…</div></div>
<div id="layer"></div>
<a id="wa" class="wa" hidden target="_blank" rel="noopener" aria-label="WhatsApp-এ মেসেজ করুন"></a>
<div id="toast" hidden></div>
<noscript><div class="boot"><h1>Golden Era BD</h1><p>ছেলে, মেয়ে ও বাচ্চাদের পছন্দের পোশাক, ক্যাশ অন ডেলিভারি ও সারা বাংলাদেশে হোম ডেলিভারি। ওয়েবসাইট দেখতে JavaScript চালু করুন।</p></div></noscript>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BN='০১২৩৪৫৬৭৮৯';
const bn=s=>String(s).replace(/\d/g,d=>BN[d]);
const toEn=s=>String(s).replace(/[০-৯]/g,d=>BN.indexOf(d));
const money=n=>'৳'+bn(Math.round(n).toLocaleString('en-IN'));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const DISTRICTS='ঢাকা,গাজীপুর,নারায়ণগঞ্জ,নরসিংদী,মানিকগঞ্জ,মুন্সিগঞ্জ,কিশোরগঞ্জ,টাঙ্গাইল,ফরিদপুর,গোপালগঞ্জ,মাদারীপুর,রাজবাড়ী,শরীয়তপুর,চট্টগ্রাম,কক্সবাজার,কুমিল্লা,ফেনী,ব্রাহ্মণবাড়িয়া,চাঁদপুর,নোয়াখালী,লক্ষ্মীপুর,খাগড়াছড়ি,রাঙ্গামাটি,বান্দরবান,রাজশাহী,নাটোর,নওগাঁ,চাঁপাইনবাবগঞ্জ,পাবনা,সিরাজগঞ্জ,বগুড়া,জয়পুরহাট,খুলনা,বাগেরহাট,সাতক্ষীরা,যশোর,ঝিনাইদহ,মাগুরা,নড়াইল,কুষ্টিয়া,চুয়াডাঙ্গা,মেহেরপুর,বরিশাল,ভোলা,পটুয়াখালী,পিরোজপুর,ঝালকাঠি,বরগুনা,সিলেট,মৌলভীবাজার,হবিগঞ্জ,সুনামগঞ্জ,রংপুর,দিনাজপুর,গাইবান্ধা,কুড়িগ্রাম,লালমনিরহাট,নীলফামারী,পঞ্চগড়,ঠাকুরগাঁও,ময়মনসিংহ,জামালপুর,নেত্রকোণা,শেরপুর'.split(',');
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#e9ecf3"/><text x="200" y="255" font-size="24" text-anchor="middle" fill="#7a859c" font-family="sans-serif">No photo</text></svg>');
const DEF={name:'Golden Era BD',tagline:'',logo:'',waIcon:'',brandColor:'#1E3A8A',heroEyebrow:'',heroTitle:'',heroSub:'',heroBtn:'কেনাকাটা শুরু করুন',perks:[],marquee:[],about:'',policies:[],copyright:'© {year} Rafid Ahammed. সর্বস্বত্ব সংরক্ষিত।',orderEmail:'',ogImage:'',favicon:'',emailjsService:'',emailjsTemplate:'',emailjsKey:'',contactEmail:'',phone:'',whatsapp:'',facebook:'',address:'',bkash:'',nagad:'',feeIn:60,feeOut:120,freeOver:0};
let S=null;
const ui={view:'home',depth:0,ev:'',cat:'',sub:'',q:'',sort:'',p:null,order:null,sending:false,err:'',key:'',errs:{}};
const form=Object.assign({name:'',phone:'',district:'',upazila:'',address:'',note:'',pay:'cod',trx:''},lsGet('rb_form',{}));
form.note='';form.trx='';form.pay='cod';
let cart=lsGet('rb_cart',[]);

const prod=id=>S.products.find(p=>p.id===id);
const vari=(p,id)=>p&&p.variants.find(v=>v.id===id);
const catOf=id=>S.categories.find(c=>c.id===id);
const subOf=p=>{const c=catOf(p.cat);return c&&(c.subs||[]).find(s=>s.id===p.sub)};
const vimg=v=>(v&&v.imgs&&v.imgs[0])||PH;
const img0=p=>{for(const v of p.variants)if(v.imgs&&v.imgs[0])return v.imgs[0];return PH};
const img1=p=>{const a=p.variants[0];if(a&&a.imgs&&a.imgs[1])return a.imgs[1];const b=p.variants[1];return b&&b.imgs&&b.imgs[0]||''};
const disc=p=>p.old>p.price&&p.price>0?Math.round((1-p.price/p.old)*100):0;
const shown=p=>p.visible!==false;
const inkFor=hex=>{const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#fff';const n=parseInt(m[1],16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>165?'#0E1630':'#fff'};
const waNum=()=>{const d=toEn(S.shop.whatsapp||'').replace(/\D/g,'');if(!d)return '';return d.indexOf('880')===0?d:(d[0]==='0'?'88'+d:d)};
const waLink=t=>'https://wa.me/'+waNum()+(t?'?text='+encodeURIComponent(t):'');
const fbUrl=()=>{const v=(S.shop.facebook||'').trim();return !v?'':/^https?:/i.test(v)?v:'https://facebook.com/'+v.replace(/^@/,'')};
const normPhone=v=>{let d=toEn(v).replace(/[\s\-+]/g,'');if(/^88/.test(d)&&d.length===13)d=d.slice(2);return /^01[3-9]\d{8}$/.test(d)?d:''};
const saveCart=()=>lsSet('rb_cart',cart);
const cartCount=()=>cart.reduce((a,i)=>a+i.qty,0);
function totals(){
  const sub=cart.reduce((a,i)=>{const p=prod(i.pid);return a+(p?p.price*i.qty:0)},0);
  let fee=null;
  if(form.district){fee=form.district==='ঢাকা'?+S.shop.feeIn||0:+S.shop.feeOut||0;if(+S.shop.freeOver>0&&sub>=+S.shop.freeOver)fee=0}
  return {sub,fee,total:sub+(fee||0)};
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},2600)}
const ICON={
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5C6.8 2.5 2.6 6.4 2.6 11.2c0 2 .7 3.9 2 5.4L3.6 21l4.6-1.3c1.2.5 2.5.8 3.8.8 5.2 0 9.4-3.9 9.4-8.7S17.200 2.500 12 2.500z"/><circle cx="8.400" cy="11.300" r="1.200" fill="#1FA855"/><circle cx="12" cy="11.300" r="1.200" fill="#1FA855"/><circle cx="15.600" cy="11.300" r="1.200" fill="#1FA855"/></svg>'
};

/* ---------- data ---------- */
function norm(d){
  d=d||{};
  const sh=Object.assign({},DEF,d.shop||{});
  ['perks','marquee','policies'].forEach(k=>{if(!Array.isArray(sh[k]))sh[k]=[]});
  S={shop:sh,categories:d.categories||[],events:d.events||[],products:d.products||[]};
  S.categories.forEach(c=>{c.subs=c.subs||[]});
  S.products.forEach(p=>{
    p.events=p.events||[];p.sizes=p.sizes||[];
    p.variants=(p.variants||[]).map(v=>{if(!v.imgs)v.imgs=v.img?[v.img]:[];return v});
    if(!p.variants.length)p.variants=[{id:'v0',name:'',hex:'#888888',imgs:[]}];
  });
}
function applyTheme(){
  const sh=S.shop,r=document.documentElement.style;
  r.setProperty('--brand',/^#[0-9a-f]{6}$/i.test(sh.brandColor)?sh.brandColor:'#1E3A8A');
  r.setProperty('--brand-ink',inkFor(sh.brandColor));
  if(!document.title)document.title=sh.name||'Golden Era BD';
  const md=$('meta[name=description]');if(md&&sh.tagline)md.content=sh.tagline;
  const ch=(sh.name||'R').trim().charAt(0).toUpperCase()||'R';
  if(sh.favicon||sh.logo)$('#fav').href=sh.favicon||sh.logo;else $('#fav').href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="${sh.brandColor||'#1E3A8A'}"/><text x="32" y="45" font-size="38" font-weight="700" text-anchor="middle" fill="#fff" font-family="sans-serif">${esc(ch)}</text></svg>`);
  const w=$('#wa');
  if(waNum()){w.hidden=false;w.href=waLink('হ্যালো, আমি '+(sh.name||'')+' থেকে কিছু জানতে চাই।');w.innerHTML=(sh.waIcon?`<img src="${esc(sh.waIcon)}" alt="">`:ICON.chat)+'<span>WhatsApp-এ মেসেজ করুন</span>'}
  else w.hidden=true;
}

/* ---------- storefront ---------- */
function marqueeHtml(){
  const items=(S.shop.marquee||[]).map(s=>String(s).trim()).filter(Boolean);
  if(!items.length)return '';
  const chars=items.join('').length||1,reps=Math.max(1,Math.ceil(240/chars));
  const g='<div class="mq-g">'+Array.from({length:reps}).map(()=>items.map(t=>`<span class="mq-i">${esc(t)}</span>`).join('')).join('')+'</div>';
  return `<div class="mq" style="--mqd:${Math.max(20,Math.round(chars*reps*0.13))}s" role="marquee" aria-label="ঘোষণা"><div class="mq-track">${g}${g.replace('class="mq-g"','class="mq-g" aria-hidden="true"')}</div></div>`;
}
function footHtml(){
  const sh=S.shop,fb=fbUrl(),cats=S.categories.filter(c=>c.visible!==false);
  const li=[];
  if(sh.contactEmail)li.push(`<li><a href="mailto:${esc(sh.contactEmail)}">ইমেইল: ${esc(sh.contactEmail)}</a></li>`);
  if(sh.phone)li.push(`<li><a href="tel:${esc(toEn(sh.phone).replace(/\s/g,''))}">ফোন: ${esc(bn(toEn(sh.phone)))}</a></li>`);
  if(waNum())li.push(`<li><a href="${waLink('')}" target="_blank" rel="noopener">WhatsApp: ${esc(bn(toEn(sh.whatsapp)))}</a></li>`);
  if(fb)li.push(`<li><a href="${esc(fb)}" target="_blank" rel="noopener">Facebook পেজ</a></li>`);
  if(sh.address)li.push(`<li>${esc(sh.address)}</li>`);
  const copy=(sh.copyright||DEF.copyright).replace('{year}',new Date().getFullYear());
  return `<footer class="foot"><div class="wrap"><div class="fg">
    <div data-rv><div class="fb">${esc(sh.name)}</div><p>${esc(sh.about||sh.tagline)}</p></div>
    <div data-rv><h4>বিভাগ</h4><ul>${cats.map(c=>`<li><button class="fl" data-act="fcat" data-id="${c.id}">${esc(c.name)}</button></li>`).join('')}</ul></div>
    <div data-rv><h4>যোগাযোগ</h4><ul>${li.join('')||'<li>শীঘ্রই যোগ করা হবে</li>'}</ul></div>
    <div data-rv><h4>আমাদের নীতি</h4><ul>${(sh.policies||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  </div><div class="copy">${esc(copy)}</div></div></footer>`;
}
function renderShell(){
  const sh=S.shop;
  const vis=S.products.filter(shown);
  const feat=vis.filter(p=>p.featured).slice(0,3);
  const hp=feat.length?feat:vis.slice(0,3);
  $('#app').innerHTML=`
  <header class="top"><div class="wrap bar">
    <a class="brand" href="./" data-act="home" aria-label="${esc(sh.name)}">${sh.logo?`<img src="${esc(sh.logo)}" alt="">`:`<span class="mk">${esc((sh.name||'R').trim().charAt(0).toUpperCase())}</span>`}<span class="nm">${esc(sh.name)}</span></a>
    <div class="hnav"><button class="hl" data-act="goshop">পোশাক দেখুন</button><button class="cartbtn" id="cartbtn" data-act="open-cart" aria-label="কার্ট দেখুন">${ICON.bag}<span>কার্ট</span><b class="cnt" id="cnt">০</b></button></div>
  </div></header>
  ${marqueeHtml()}
  <section class="hero"><div class="wrap hero-in">
    <div>
      ${sh.heroEyebrow?`<span class="eyebrow">${esc(sh.heroEyebrow)}</span>`:''}
      <h1>${esc(sh.heroTitle||sh.tagline||sh.name)}</h1>
      <p class="sub">${esc(sh.heroSub)}</p>
      <div class="cta"><button class="btn pri" data-act="goshop">${esc(sh.heroBtn||'কেনাকাটা শুরু করুন')}</button>${waNum()?`<a class="btn ghost" href="${waLink('')}" target="_blank" rel="noopener">WhatsApp-এ জিজ্ঞাসা</a>`:''}</div>
      <ul class="perks">${(sh.perks||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    </div>
    <div class="hero-art">${hp.map(p=>`<button class="hi" data-act="open-p" data-id="${p.id}" aria-label="${esc(p.name)}"><img src="${esc(img0(p))}" alt="${esc(p.name)}"></button>`).join('')}</div>
  </div></section>
  <section class="shop" id="shop"><div class="wrap">
    <div id="events"></div><div id="cats"></div><div id="subs"></div>
    <div class="tools"><label class="srch">${ICON.search}<input id="q" type="search" placeholder="নাম বা পণ্যের কোড দিয়ে খুঁজুন" autocomplete="off"></label>
    <select id="sort" aria-label="সাজান"><option value="">ডিফল্ট ক্রম</option><option value="low">দাম: কম থেকে বেশি</option><option value="high">দাম: বেশি থেকে কম</option></select></div>
    <div class="info" id="info"></div><div class="grid" id="grid"></div>

let io=null;
function reveal(){
  const els=document.querySelectorAll('.rv:not(.vis),[data-rv]:not(.vis)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('vis'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('vis');io.unobserve(en.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.05});
  els.forEach(e=>{e.classList.add('rv');io.observe(e)});
}

  const e={};
  if(form.name.trim().length<2)e.name='আপনার নাম লিখুন';
  if(!normPhone(form.phone))e.phone='সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন ০১৭XXXXXXXX)';
  if(!form.district)e.district='জেলা বাছাই করুন';
  if(form.address.trim().length<6)e.address='বাড়ি/রোড/এলাকাসহ পূর্ণ ঠিকানা লিখুন';
  if(form.pay!=='cod'&&form.trx.trim().length<4)e.trx='পেমেন্টের ট্রানজেকশন আইডি দিন, অথবা ক্যাশ অন ডেলিভারি বেছে নিন';
  return e;
}
const payName=()=>form.pay==='cod'?'ক্যাশ অন ডেলিভারি':(form.pay==='bkash'?'বিকাশ':'নগদ')+' (TrxID: '+form.trx.trim()+')';
function buildOrder(){
  const t=totals(),d=new Date(),pad=n=>('0'+n).slice(-2);
  const code=String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.floor(1000+Math.random()*9000);
  const items=cart.map(i=>{const p=prod(i.pid),v=vari(p,i.vid);return {code:p.code||'',name:p.name,color:v.name,size:i.size,qty:i.qty,line:p.price*i.qty}});
  const o={code,items,sub:t.sub,fee:t.fee,total:t.total,name:form.name.trim(),phone:normPhone(form.phone),addr:form.address.trim()+(form.upazila.trim()?', '+form.upazila.trim():'')+', '+form.district};
  o.itemLines=items.map((i,n)=>`${n+1}) ${i.code?'[কোড: '+i.code+'] ':''}${i.name}${i.color?' ('+i.color+')':''}${i.size?' সাইজ '+i.size:''} × ${i.qty} = ${money(i.line)}`);
  o.text=[`নতুন অর্ডার #${code}`,`নাম: ${o.name}`,`মোবাইল: ${o.phone}`,`ঠিকানা: ${o.addr}`,'------',...o.itemLines,'------',`সাবটোটাল: ${money(o.sub)}`,`ডেলিভারি চার্জ: ${o.fee===0?'ফ্রি':money(o.fee)}`,`মোট: ${money(o.total)}`,`পেমেন্ট: ${payName()}`].concat(form.note.trim()?['নোট: '+form.note.trim()]:[]).join('\n');
  return o;
}
function reviewSheet(){
  const o=ui.order;
  let h=`<div class="ov" data-act="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="অর্ডার কনফার্ম" tabindex="-1" data-scroll><button class="x" data-act="close" aria-label="বন্ধ করুন">×</button><h2 class="t">অর্ডার কনফার্ম করুন</h2>${s3(2)}
  <div class="box"><b>${esc(o.name)} · ${esc(bn(o.phone))}</b>${esc(o.addr)}</div>`;
  cart.forEach(i=>{h+=itemRow(i,null)});
  h+=`<div class="sum"><div><span>সাবটোটাল</span><span>${money(o.sub)}</span></div><div><span>ডেলিভারি চার্জ</span><span>${o.fee===0?'ফ্রি':money(o.fee)}</span></div><div class="tot"><span>মোট</span><span>${money(o.total)}</span></div></div>
  <div class="box" style="margin-top:12px"><b>পেমেন্ট</b>${esc(payName())}</div>${form.note.trim()?`<div class="box"><b>নোট</b>${esc(form.note.trim())}</div>`:''}`;
  if(ui.err){
    h+=`<div class="note bad"><b>অর্ডারটি এখনো পাঠানো যায়নি।</b> ${esc(ui.err)}${waNum()?' আপনি চাইলে নিচের বাটনে WhatsApp-এ অর্ডার পাঠাতে পারেন।':''}</div>`;
  }
  h+=`<div class="btns"><button class="btn pri" data-act="confirm"${ui.sending?' disabled':''}>${ui.sending?'পাঠানো হচ্ছে…':(ui.err?'আবার চেষ্টা করুন':'অর্ডার কনফার্ম করুন')}</button>${ui.err&&waNum()?`<a class="btn wa" data-act="wa-sent" target="_blank" rel="noopener" href="${esc(waLink(o.text))}">WhatsApp-এ অর্ডার পাঠান</a>`:''}<button class="btn ghost" data-act="back"${ui.sending?' disabled':''}>তথ্য বদলান</button></div></div></div>`;
  return h;
}
function doneSheet(){
  const o=ui.order;
  return `<div class="ov" data-act="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="অর্ডার সম্পন্ন" tabindex="-1" data-scroll><button class="x" data-act="close" aria-label="বন্ধ করুন">×</button>${s3(3)}
  <div class="okc"><svg viewBox="0 0 52 52" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg></div>
  <h2 class="t center" style="padding:0">ধন্যবাদ, অর্ডার পেয়েছি!</h2>
  <div class="box center"><b>অর্ডার নম্বর #<span class="code">${esc(o.code)}</span></b>মোট ${money(o.total)} · ${esc(payName())}</div>
  <p class="center" style="color:var(--mute)">আমরা শীঘ্রই <b>${esc(bn(o.phone))}</b> নম্বরে কল করে অর্ডার নিশ্চিত করব। অর্ডার নম্বরটি সংরক্ষণ করে রাখুন।</p>
  <div class="btns">${waNum()?`<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink('আমার অর্ডার #'+o.code+' সম্পর্কে জানতে চাই।'))}">অর্ডার নিয়ে WhatsApp-এ কথা বলুন</a>`:''}<button class="btn pri" data-act="close">আরও কেনাকাটা করুন</button></div></div></div>`;
}

/* ---------- order email ---------- */
async function sendOrder(o){
  const sh=S.shop,ejS=(sh.emailjsService||'').trim(),ejT=(sh.emailjsTemplate||'').trim(),ejK=(sh.emailjsKey||'').trim();
  if(ejS&&ejT&&ejK){
    const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:ejS,template_id:ejT,user_id:ejK,template_params:{title:`অর্ডার #${o.code}`,name:o.name,email:'order@website',message:`অর্ডার #${o.code}\nনাম: ${o.name}\nফোন: ${o.phone}\nঠিকানা: ${o.addr}\n\nপণ্য:\n${o.itemLines.join('\n')}\n\nসাবটোটাল: ${money(o.sub)}\nডেলিভারি: ${o.fee===0?'ফ্রি':money(o.fee)}\nমোট: ${money(o.total)}\nপেমেন্ট: ${payName()}\nনোট: ${form.note.trim()||'-'}`,subject:`নতুন অর্ডার #${o.code} · ${o.name} · ${money(o.total)}`,order_code:o.code,customer_name:o.name,phone:o.phone,address:o.addr,items:o.itemLines.join('\n'),subtotal:money(o.sub),delivery:o.fee===0?'ফ্রি':money(o.fee),total:money(o.total),payment:payName(),note:form.note.trim()||'-'}})});
    if(!r.ok)throw new Error('অর্ডার ইমেইল পাঠানো যায়নি');
    return;
  }
  const ep=(sh.orderEmail||'').trim();
  if(!ep)throw new Error('দোকানের অর্ডার ইমেইল সেট করা নেই।');
  const body={_subject:`নতুন অর্ডার #${o.code} — ${o.name} — ${money(o.total)}`,_template:'table',_captcha:'false',
    'অর্ডার নম্বর':'#'+o.code,'নাম':o.name,'মোবাইল':o.phone,'ঠিকানা':o.addr,'পণ্য (কোডসহ)':o.itemLines.join('\n'),
    'সাবটোটাল':money(o.sub),'ডেলিভারি চার্জ':o.fee===0?'ফ্রি':money(o.fee),'মোট':money(o.total),'পেমেন্ট':payName(),'নোট':form.note.trim()||'-'};
  const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(ep),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||String(j.success)==='false')throw new Error('ইমেইল সার্ভার সাড়া দেয়নি।');
}
async function confirmOrder(){
  if(ui.sending)return;
  ui.sending=true;ui.err='';renderLayer();
  try{await sendOrder(ui.order)}
  catch(e){ui.sending=false;ui.err=(e&&e.message)||'ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।';renderLayer();return}
  ui.sending=false;finishOrder();
}
function finishOrder(){
  cart=[];saveCart();updateCart();
  history.replaceState({v:'done',d:ui.depth},'');
  ui.view='done';ui.err='';renderLayer();
}

/* ---------- events ---------- */
function act(el,e){
  const a=el.dataset.act,id=el.dataset.id,d=+el.dataset.d;
  switch(a){
    case 'ov':if(e.target===el)closeAll();break;
    case 'close':closeAll();break;
    case 'back':history.back();break;
    case 'home':window.scrollTo({top:0,behavior:'smooth'});break;
    case 'goshop':goShop();break;
    case 'fcat':ui.cat=id;ui.sub='';ui.ev='';renderEvents();renderCats();renderGrid();goShop();break;
    case 'ev':ui.ev=ui.ev===id?'':id;renderEvents();renderGrid();break;
    case 'more':ui.cat=el.dataset.id;ui.sub=el.dataset.s;renderCats();renderGrid();goShop();break;
    case 'cat':ui.cat=id;ui.sub='';renderCats();renderGrid();break;
    case 'sub':ui.sub=id;renderCats();renderGrid();break;
    case 'clear':ui.ev=ui.cat=ui.sub=ui.q='';ui.sort='';$('#q').value='';$('#sort').value='';renderEvents();renderCats();renderGrid();break;
    case 'open-p':{const p=prod(id);ui.p={pid:id,vid:p.variants[0].id,gi:0,size:'',qty:1,err:0};push('product');break}
    case 'pick-v':ui.p.vid=id;ui.p.gi=0;renderLayer();break;
    case 'pick-s':ui.p.size=el.dataset.v;ui.p.err=0;renderLayer();break;
    case 'pq':ui.p.qty=Math.max(1,Math.min(20,ui.p.qty+d));renderLayer();break;
    case 'gi':ui.p.gi=+el.dataset.i;renderLayer();break;
    case 'gnav':{const p=prod(ui.p.pid),n=gal(p,vari(p,ui.p.vid)||p.variants[0]).length;ui.p.gi=((ui.p.gi||0)+d+n)%n;renderLayer();break}
    case 'add':case 'add-go':{
      const p=prod(ui.p.pid);
      if(p.sizes.length&&!ui.p.size){ui.p.err=1;renderLayer();break}
      const ex=cart.find(i=>i.pid===ui.p.pid&&i.vid===ui.p.vid&&i.size===ui.p.size);
      if(ex)ex.qty=Math.min(20,ex.qty+ui.p.qty);else cart.push({pid:ui.p.pid,vid:ui.p.vid,size:ui.p.size,qty:ui.p.qty});
      saveCart();updateCart(true);
      if(a==='add-go')push('checkout');else{closeAll();toast('কার্টে যোগ হয়েছে')}
      break}
    case 'open-cart':push('cart');break;
    case 'cq':{const it=cart[+el.dataset.i];it.qty=Math.max(1,Math.min(20,it.qty+d));saveCart();updateCart();renderLayer();break}
    case 'rm':cart.splice(+el.dataset.i,1);saveCart();updateCart();renderLayer();break;
    case 'checkout':ui.errs={};push('checkout');break;
    case 'review':{
      ui.errs=validate();
      const k=Object.keys(ui.errs);
      if(k.length){['name','phone','district','address','trx'].forEach(x=>{const m=$('#e-'+x),i=$('#f-'+x);if(m)m.textContent=ui.errs[x]||'';if(i)i.classList.toggle('invalid',!!ui.errs[x])});const f=['name','phone','district','address','trx'].find(x=>ui.errs[x]);const el2=$('#f-'+f);if(el2){el2.scrollIntoView({block:'center'});el2.focus({preventScroll:true})}break}
      lsSet('rb_form',{name:form.name,phone:form.phone,district:form.district,upazila:form.upazila,address:form.address});
      ui.order=buildOrder();ui.err='';push('review');break}
    case 'confirm':confirmOrder();break;
    case 'wa-sent':setTimeout(()=>{if(ui.view==='review')finishOrder()},400);break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A'&&el.dataset.act!=='wa-sent')e.preventDefault();
  act(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.view!=='home')closeAll()});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){clearTimeout(act.t);act.t=setTimeout(()=>{ui.q=el.value;renderGrid()},160);return}
  if(!el.dataset.f)return;
  if(el.type==='radio'){if(el.checked){form.pay=el.value;ui.errs.trx='';payBlock();}return}
  form[el.dataset.f]=el.value;
  if(el.dataset.f==='district'){const m=$('#sum');if(m)m.innerHTML=sumHtml()}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){ui.sort=e.target.value;renderGrid()}});

/* ---------- start ---------- */
if('scrollRestoration' in history)history.scrollRestoration='auto';
history.replaceState({v:'home',d:0},'');
fetch('data/shop.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  norm(d);
  cart=cart.filter(i=>prod(i.pid)&&vari(prod(i.pid),i.vid));
  applyTheme();renderShell();
}).catch(()=>{
  $('#app').innerHTML='<div class="boot"><h2>ওয়েবসাইট লোড হয়নি</h2><p>ফাইলটি ডাবল-ক্লিক করে না খুলে GitHub Pages বা অন্য ওয়েব সার্ভার থেকে খুলুন।</p></div>';
});
})();
</script>
